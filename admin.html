<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R&S Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b100d;color:#f4f7f4;font:15px Arial;line-height:1.5}.wrap{max-width:1150px;margin:auto;padding:36px 22px}.brand{font-size:22px;font-weight:900}.brand span{color:#65d47b}.muted{color:#a9b6ac}.panel{background:#111b14;border:1px solid #344238;padding:24px;margin:22px 0}.login{max-width:420px;margin:8vh auto}.field{display:block;margin:15px 0}.field input{display:block;width:100%;padding:12px;margin-top:6px}.btn{padding:12px 18px;background:#65d47b;border:0;font-weight:800;cursor:pointer}.error{color:#ff9b9b}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs button{padding:10px 16px;background:#1c2a20;color:white;border:1px solid #506153;cursor:pointer}.tabs button.active{background:#65d47b;color:#09100a}.item{border-top:1px solid #344238;padding:16px 0;display:grid;grid-template-columns:1fr auto;gap:15px}.item small{display:block;color:#a9b6ac}.item select{padding:8px}.hidden{display:none}a{color:#65d47b}@media(max-width:600px){.item{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="brand">R<span>&amp;</span>S OILFIELD RECRUITMENT <span class="muted">/ ADMIN</span></div><section id="login" class="panel login"><h1>Staff sign in</h1><p class="muted">Authorized R&amp;S personnel only.</p><form id="loginForm"><label class="field">Email<input name="email" type="email" required autocomplete="username"></label><label class="field">Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn">SIGN IN</button><p id="loginStatus" class="error"></p></form></section><section id="dashboard" class="hidden"><div class="panel"><button id="logout" class="btn" style="float:right">SIGN OUT</button><h1>Recruiting dashboard</h1><p class="muted">Private candidate applications and employer hiring requests.</p><div class="tabs"><button id="applicationsTab" class="active">Candidate applications</button><button id="inquiriesTab">Employer inquiries</button><button id="refresh">Refresh</button></div></div><div class="panel"><h2 id="listTitle">Candidate applications</h2><div id="records"></div><p id="listStatus" class="muted"></p></div></section></div><script>
const API='https://rs-oilfield-api.onrender.com/api';let data={applications:[],inquiries:[]},view='applications';
const $=id=>document.getElementById(id);
async function call(path,opts={}){const token=sessionStorage.getItem('rs_admin_token');const r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
function showDashboard(){ $('login').classList.add('hidden');$('dashboard').classList.remove('hidden')}
function showLogin(){ $('dashboard').classList.add('hidden');$('login').classList.remove('hidden')}
async function load(){ $('listStatus').textContent='Loading…';try{data=await call('/admin/overview');render()}catch(e){$('listStatus').textContent=e.message}}
function render(){const rows=data[view]||[];$('listTitle').textContent=view==='applications'?'Candidate applications':'Employer inquiries';$('records').innerHTML='';if(!rows.length){$('records').textContent='No submissions yet.'}rows.forEach(x=>{const el=document.createElement('article');el.className='item';const left=document.createElement('div');const title=view==='applications'?x.full_name:x.company;const detail=view==='applications'?(x.target_role+' · '+x.location):(x.job_title+' · '+x.location);left.innerHTML='<strong></strong><small></small><small></small><p></p>';left.children[0].textContent=title;left.children[1].textContent=detail;left.children[2].textContent=x.email+' · '+(x.phone||'');left.children[3].textContent=view==='applications'?(x.experience||''):(x.details||'');const right=document.createElement('div');const sel=document.createElement('select');const opts=view==='applications'?['new','reviewing','contacted','placed','closed']:['new','reviewing','contacted','filled','closed'];opts.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;o.selected=x.status===v;sel.appendChild(o)});sel.addEventListener('change',async()=>{try{await call('/admin/'+view+'/'+x.id,{method:'PATCH',body:JSON.stringify({status:sel.value})});x.status=sel.value}catch(e){alert(e.message)}});right.appendChild(sel);el.append(left,right);$('records').appendChild(el)});$('listStatus').textContent=rows.length+' record(s) shown. Latest 200 maximum.'}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginStatus').textContent='Signing in…';const fd=new FormData(e.target);try{const result=await call('/admin/login',{method:'POST',body:JSON.stringify(Object.fromEntries(fd.entries()))});sessionStorage.setItem('rs_admin_token',result.token);showDashboard();await load()}catch(err){$('loginStatus').textContent=err.message}});
$('logout').addEventListener('click',async()=>{try{await call('/admin/logout',{method:'POST'})}finally{sessionStorage.removeItem('rs_admin_token');showLogin()}});
$('applicationsTab').addEventListener('click',()=>switchView('applications'));$('inquiriesTab').addEventListener('click',()=>switchView('inquiries'));$('refresh').addEventListener('click',load);
function switchView(v){view=v;$('applicationsTab').classList.toggle('active',v==='applications');$('inquiriesTab').classList.toggle('active',v==='inquiries');render()}
call('/admin/me').then(()=>{showDashboard();load()}).catch(showLogin);
</script></body></html>
